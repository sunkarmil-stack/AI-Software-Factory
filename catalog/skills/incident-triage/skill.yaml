name: incident-triage
version: 1.0.0
owner: ai-platform-team
description: Triage sanitized telemetry into incident or fix proposals with explicit
  uncertainty.
compatibility:
  factory: '>=0.1'
  agents: any delivery agent
inputs:
- sanitized metrics
- recent deployments
outputs:
- incident proposals
requested_capabilities:
- telemetry.read_sanitized
- review.create_item
data_classes:
- internal
- confidential
side_effects: none
network: false
limitations:
- Correlation is not causation; proposals require human review.
risk: low
tests:
- name: structure
  expect_sections:
  - '## Inputs'
  - '## Outputs'
  - '## Procedure'
  - '## Limitations'
