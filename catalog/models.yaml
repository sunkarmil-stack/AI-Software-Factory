egress_allowlist:
- api.anthropic.com
- '*.openai.azure.com'
deployments:
- id: delivery-default
  provider: offline
  model: rules-v1
  revision: rules-v1
  approved_uses:
  - delivery.*
  data_classes: &id001
  - public
  - internal
  - confidential
  cost_per_1k_in: 0.0
  cost_per_1k_out: 0.0
  rpm_per_project: 100000
  fallback_for: []
  eval_status: approved
  note: logical route used by agent manifests; dev profile serves it with the offline
    provider
- id: product-rag
  provider: offline
  model: rules-v1
  revision: rules-v1
  approved_uses:
  - product.rag
  data_classes: *id001
  cost_per_1k_in: 0.0
  cost_per_1k_out: 0.0
  rpm_per_project: 100000
  fallback_for: []
  eval_status: approved
  note: logical route for the product RAG agent; dev profile serves it with the offline
    provider
- id: offline-deterministic-v1
  provider: offline
  model: rules-v1
  revision: rules-v1
  approved_uses:
  - delivery.*
  - product.rag
  data_classes: *id001
  cost_per_1k_in: 0.0
  cost_per_1k_out: 0.0
  rpm_per_project: 100000
  fallback_for:
  - claude-delivery
  - azure-gpt-delivery
  eval_status: approved
- id: claude-delivery
  provider: anthropic
  model: claude-sonnet-5-5
  secret_ref: ANTHROPIC_API_KEY
  approved_uses:
  - delivery.*
  data_classes:
  - public
  - internal
  cost_per_1k_in: 0.003
  cost_per_1k_out: 0.015
  rpm_per_project: 120
  approved_fallbacks:
  - offline-deterministic-v1
  eval_status: pending-phase0
- id: azure-gpt-delivery
  provider: azure_openai
  model: gpt-delivery
  endpoint: https://YOUR-RESOURCE.openai.azure.com
  secret_ref: AZURE_OPENAI_API_KEY
  approved_uses:
  - delivery.*
  data_classes:
  - public
  - internal
  cost_per_1k_in: 0.0025
  cost_per_1k_out: 0.01
  rpm_per_project: 120
  eval_status: pending-phase0
- id: advisory-copilot
  provider: offline
  model: rules-v1
  revision: rules-v1
  approved_uses:
  - product.advisory
  - product.suitability
  data_classes:
  - public
  - internal
  - confidential
  cost_per_1k_in: 0.0
  cost_per_1k_out: 0.0
  rpm_per_project: 100000
  fallback_for: []
  eval_status: approved
  note: wealth-advisory product route; restricted data (MNPI) is NOT approved until
    information barriers exist
- id: regreport-analyst
  provider: offline
  model: rules-v1
  revision: rules-v1
  approved_uses:
  - product.regreport.variance
  - product.regreport.dq
  data_classes:
  - public
  - internal
  - confidential
  cost_per_1k_in: 0.0
  cost_per_1k_out: 0.0
  rpm_per_project: 100000
  eval_status: approved
  note: 'regulatory reporting assistant: drafts commentary and DQ triage only; never
    computes or files figures'
  fallback_for: []
- id: risk-analyst
  provider: offline
  model: rules-v1
  revision: rules-v1
  approved_uses:
  - product.risk.fraud
  - product.risk.credit
  data_classes:
  - public
  - internal
  - confidential
  cost_per_1k_in: 0.0
  cost_per_1k_out: 0.0
  rpm_per_project: 100000
  eval_status: approved
  note: 'risk investigation assistant: summarizes evidence only; never scores, decides
    or acts'
  fallback_for: []
