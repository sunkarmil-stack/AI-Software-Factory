egress_allowlist:
- api.anthropic.com
- '*.openai.azure.com'
deployments:
- id: offline-deterministic-v1
  provider: offline
  model: rules-v1
  revision: rules-v1
  approved_uses:
  - delivery.*
  - product.rag
  data_classes:
  - public
  - internal
  - confidential
  cost_per_1k_in: 0.0
  cost_per_1k_out: 0.0
  rpm_per_project: 100000
  fallback_for:
  - claude-delivery
  - azure-gpt-delivery
  eval_status: approved
- id: claude-delivery
  provider: anthropic
  model: claude-sonnet-5-5
  secret_ref: ANTHROPIC_API_KEY
  approved_uses:
  - delivery.*
  data_classes:
  - public
  - internal
  cost_per_1k_in: 0.003
  cost_per_1k_out: 0.015
  rpm_per_project: 120
  approved_fallbacks:
  - offline-deterministic-v1
  eval_status: pending-phase0
- id: azure-gpt-delivery
  provider: azure_openai
  model: gpt-delivery
  endpoint: https://YOUR-RESOURCE.openai.azure.com
  secret_ref: AZURE_OPENAI_API_KEY
  approved_uses:
  - delivery.*
  data_classes:
  - public
  - internal
  cost_per_1k_in: 0.0025
  cost_per_1k_out: 0.01
  rpm_per_project: 120
  eval_status: pending-phase0
