id: release-advisor
version: 1.0.0
owner: ai-platform-team
description: Summarizes release evidence; cannot authorize promotion.
framework:
  name: factory-native
  version: 0.1.0
  alternative_spike: langgraph
runtime:
  python: '3.12'
  worker_type: agent-worker
skills:
- name: release-evidence-assembly
  version: 1.0.0
model:
  deployment: delivery-default
  purpose: delivery.release
tools: []
state_schema:
  type: object
  properties:
    task:
      type: object
    result:
      type: object
memory_policy:
  transient: per-task, cleared at completion
  persistent: none
budgets:
  max_model_tokens: 60000
  max_tool_calls: 20
  max_cost_usd: 2.0
termination:
  on_ambiguity: blocked
  on_budget: stop_and_escalate
  max_repairs: 1
evaluation_suite: evals/delivery-agents.yaml
deployment_class: delivery
prompt:
  id: release-advisor
  version: 1.0.0
task_kind: release.advise
payload_schema:
  type: object
  required:
  - recommendation
  - can_authorize
  properties:
    recommendation:
      type: string
    can_authorize:
      const: false
