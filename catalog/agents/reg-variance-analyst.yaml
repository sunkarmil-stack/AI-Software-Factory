id: reg-variance-analyst
version: 1.0.0
owner: regulatory-reporting
description: Drafts factual variance commentary from computed figures; never states
  drivers, computes or files.
framework:
  name: factory-native
  version: 0.1.0
  alternative_spike: langgraph
runtime:
  python: '3.12'
  worker_type: agent-worker
skills:
- name: regulatory-reporting-analysis
  version: 1.0.0
model:
  deployment: regreport-analyst
  purpose: product.regreport.variance
tools: []
state_schema:
  type: object
  properties:
    task:
      type: object
    result:
      type: object
memory_policy:
  transient: per-task, cleared at completion
  persistent: none (the lakehouse and return registry are the source)
budgets:
  max_model_tokens: 40000
  max_tool_calls: 6
  max_cost_usd: 1.0
termination:
  on_ambiguity: blocked
  on_budget: stop_and_escalate
  max_repairs: 1
evaluation_suite: catalog/domains/osfi-regulatory-reporting/evals.yaml
deployment_class: product
prompt:
  id: reg-variance-analyst
  version: 1.0.0
task_kind: regrep.variance
payload_schema:
  type: object
  required:
  - commentary
  properties:
    commentary:
      type: array
      items:
        type: object
        required:
        - cell_id
        - draft
        properties:
          cell_id:
            type: string
          draft:
            type: string
