id: credit-watch-analyst
version: 1.0.0
owner: retail-risk
description: Summarizes credit early-warning alerts; suggests a next step; never changes
  limits or staging.
framework:
  name: factory-native
  version: 0.1.0
  alternative_spike: langgraph
runtime:
  python: '3.12'
  worker_type: agent-worker
skills:
- name: risk-investigation
  version: 1.0.0
model:
  deployment: risk-analyst
  purpose: product.risk.credit
tools: []
state_schema:
  type: object
  properties:
    task:
      type: object
    result:
      type: object
memory_policy:
  transient: per-task, cleared at completion
  persistent: none (case management is the record)
budgets:
  max_model_tokens: 30000
  max_tool_calls: 0
  max_cost_usd: 0.5
termination:
  on_ambiguity: blocked
  on_budget: stop_and_escalate
  max_repairs: 1
evaluation_suite: catalog/domains/retail-account-risk/evals.yaml
deployment_class: product
prompt:
  id: credit-watch-analyst
  version: 1.0.0
task_kind: risk.credit
payload_schema:
  type: object
  required:
  - summary
  - suggested_next_step
  properties:
    summary:
      type: string
    suggested_next_step:
      enum:
      - monitor
      - limit_review
      - collections_referral
