name: account_controls
version: 1.0.0
owner: card-and-payments-ops
description: Places temporary account restrictions. Consequential for the customer;
  reversible by lifting the restriction.
actions:
  restrict:
    side_effect: consequential
    reversible: true
    data_class: confidential
    input_schema:
      type: object
      required:
      - subject_id
      - case_id
      - restriction
      - duration_hours
      - tenant
      properties:
        subject_id:
          type: string
        case_id:
          type: string
        restriction:
          type: string
        duration_hours:
          type: integer
        tenant:
          type: string
    output_schema:
      type: object
      required:
      - restriction_id
      - status
      - expires_at
resource_scope: '{tenant}/ontology'
data_classes:
- confidential
authentication: workload-identity
authorization: identity grant + tenant + resource + policy tier
circuit:
  threshold: 3
  cooldown_s: 10
max_concurrency: 8
timeout_s: 15
retry:
  max: 0
  retry_on: []
idempotency:
  required: true
  key: operation id bound to payload digest
endpoint:
  via: ai_gateway
  api: account-controls
  actions:
    restrict:
      method: POST
      path: /restrictions
  reconcile:
    method: GET
    path: /restrictions
    query: operation_id
