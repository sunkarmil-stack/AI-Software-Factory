name: kb
version: 1.0.0
owner: ai-platform-team
actions:
  search:
    side_effect: read
    input_schema:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        k:
          type: integer
    output_schema:
      type: object
      required:
      - passages
      properties: {}
resource_scope: '{tenant}/{project}'
data_classes:
- internal
- confidential
authentication: workload-identity
authorization: identity grant + tenant + resource + policy tier
timeout_s: 30
retry:
  max: 2
  retry_on:
  - timeout
  - '429'
  - '503'
idempotency:
  required: false
  key: operation id bound to payload digest
max_concurrency: 4
circuit:
  threshold: 3
  cooldown_s: 10
internal: true
