name: repo
version: 1.0.0
owner: ai-platform-team
actions:
  push:
    side_effect: write
    input_schema:
      type: object
      required:
      - branch
      - workdir
      properties:
        branch: &id001
          type: string
        workdir: *id001
    output_schema:
      type: object
      required:
      - sha
      properties: {}
    reversible: true
  open_pr:
    side_effect: write
    input_schema:
      type: object
      required:
      - branch
      - title
      properties:
        branch: *id001
        title: *id001
    output_schema:
      type: object
      required:
      - pr_id
      - head_sha
      properties: {}
    reversible: true
resource_scope: '{tenant}/{project}'
data_classes:
- internal
authentication: workload-identity
authorization: identity grant + tenant + resource + policy tier
timeout_s: 30
retry:
  max: 2
  retry_on:
  - timeout
  - '429'
  - '503'
idempotency:
  required: false
  key: operation id bound to payload digest
max_concurrency: 4
circuit:
  threshold: 3
  cooldown_s: 10
