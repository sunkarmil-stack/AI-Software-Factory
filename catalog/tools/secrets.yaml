name: secrets
version: 1.0.0
owner: security
actions:
  read:
    side_effect: read
    input_schema:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    output_schema:
      type: object
      required:
      - value
      properties: {}
    data_class: restricted
resource_scope: '{tenant}/{project}'
data_classes:
- restricted
authentication: workload-identity
authorization: identity grant + tenant + resource + policy tier
timeout_s: 30
retry:
  max: 2
  retry_on:
  - timeout
  - '429'
  - '503'
idempotency:
  required: false
  key: operation id bound to payload digest
max_concurrency: 4
circuit:
  threshold: 3
  cooldown_s: 10
