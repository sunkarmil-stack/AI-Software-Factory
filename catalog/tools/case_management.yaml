name: case_management
version: 1.0.0
owner: retail-risk
description: Case management system of record for fraud, AML and credit cases.
actions:
  open:
    side_effect: write
    reversible: true
    data_class: confidential
    input_schema:
      type: object
      required:
      - subject_id
      - case_type
      - alert_id
      - score
      - reason_codes
      - tenant
      properties:
        subject_id:
          type: string
        case_type:
          type: string
        alert_id:
          type: string
        score:
          type: number
        reason_codes:
          type: string
        tenant:
          type: string
    output_schema:
      type: object
      required:
      - case_id
      - status
resource_scope: '{tenant}/ontology'
data_classes:
- confidential
authentication: workload-identity
authorization: identity grant + tenant + resource + policy tier
circuit:
  threshold: 3
  cooldown_s: 10
max_concurrency: 8
timeout_s: 15
retry:
  max: 2
  retry_on:
  - timeout
  - '503'
idempotency:
  required: true
  key: operation id bound to payload digest
endpoint:
  via: ai_gateway
  api: case-management
  actions:
    open:
      method: POST
      path: /cases
  reconcile:
    method: GET
    path: /cases
    query: operation_id
