# Default deny; factory pods may reach only: DNS, Postgres, private endpoints (KV/ACR/Blob),
# the enterprise AI gateway, Entra (via egress firewall FQDN rules), the OTel collector, the K8s API (worker).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: factory-egress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/part-of: ai-software-factory } }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: [{ ipBlock: { cidr: {{ required "network.postgresCidr is required" .Values.network.postgresCidr }} } }]
      ports: [{ port: 5432 }]
    - to: [{ ipBlock: { cidr: {{ required "network.aiGatewayCidr is required" .Values.network.aiGatewayCidr }} } }]
      ports: [{ port: 443 }]
    - to: [{ ipBlock: { cidr: {{ required "network.privateEndpointCidr is required" .Values.network.privateEndpointCidr }} } }]
      ports: [{ port: 443 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } } }]
      ports: [{ port: 4318 }]
    - ports: [{ port: 443 }]   # Entra token endpoint + API server; FQDN-restricted by the hub firewall
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-ingress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: api } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.network.ingressNamespace }} } } }]
      ports: [{ port: 8088 }]
