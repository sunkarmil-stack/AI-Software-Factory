apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-api
  labels: {{- include "asf.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/component: api } }
  template:
    metadata:
      labels: {{- include "asf.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
        azure.workload.identity/use: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: factory-api
      {{- include "asf.podSecurity" . | nindent 6 }}
      nodeSelector: { factory/pool: app }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule,
            labelSelector: { matchLabels: { app.kubernetes.io/component: api } } }
      containers:
        - name: api
          image: {{ include "asf.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--host", "0.0.0.0", "--port", "8088"]
          env: {{- include "asf.env" . | nindent 12 }}
          ports: [{ name: http, containerPort: 8088 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 30 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "asf.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: config, mountPath: /etc/factory, readOnly: true }
            - { name: home, mountPath: /var/factory }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: factory-config } }
        - { name: home, emptyDir: { sizeLimit: 2Gi } }
        - { name: tmp, emptyDir: { sizeLimit: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: factory-api
  labels: {{- include "asf.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
