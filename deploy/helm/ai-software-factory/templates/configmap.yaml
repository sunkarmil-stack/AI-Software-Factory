apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-config
  labels: {{- include "asf.labels" . | nindent 4 }}
data:
  factory.yaml: |
    profile: {{ .Values.factory.profile }}
    auth: entra
    signer: keyvault
    secrets: keyvault
    execution: queue
    models_catalog: models.production.yaml
    deployment_target: {{ .Values.factory.deployment.target }}
    gitops_repo: {{ .Values.factory.deployment.gitopsRepo | quote }}
    sandbox_backend: kubernetes
    sandbox_runtime_class: {{ .Values.sandbox.runtimeClass }}
    sandbox_namespace: {{ .Values.sandbox.namespace }}
    otel_endpoint: {{ .Values.factory.otelEndpoint | quote }}
    ai_gateway:
      base_url: {{ required "factory.aiGateway.baseUrl is required" .Values.factory.aiGateway.baseUrl | quote }}
      audience: {{ .Values.factory.aiGateway.audience | quote }}
    entra:
      tenant_id: {{ .Values.azure.tenantId | quote }}
      audience: {{ .Values.factory.entra.audience | quote }}
      issuer: "https://login.microsoftonline.com/{{ .Values.azure.tenantId }}/v2.0"
      jwks_url: "https://login.microsoftonline.com/{{ .Values.azure.tenantId }}/discovery/v2.0/keys"
      role_map: {{- toYaml .Values.factory.entra.roleMap | nindent 8 }}
      tenant_map: {{- toYaml .Values.factory.entra.tenantMap | nindent 8 }}
    keyvault:
      url: {{ required "factory.keyVault.url is required" .Values.factory.keyVault.url | quote }}
      audience: https://vault.azure.net
      keys: {{- toYaml .Values.factory.keyVault.keys | nindent 8 }}
    exemptions: {{- toYaml .Values.factory.exemptions | nindent 6 }}
