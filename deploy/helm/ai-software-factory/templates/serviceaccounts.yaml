{{- range $wl := list "api" "worker" "migrate" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-{{ $wl }}
  labels: {{- include "asf.labels" $ | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required (printf "azure.clientIds.%s is required" $wl) (index $.Values.azure.clientIds $wl) | quote }}
    azure.workload.identity/tenant-id: {{ $.Values.azure.tenantId | quote }}
{{- end }}
---
# The worker launches sandbox Jobs in the sandbox namespace and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-sandbox-launcher
  namespace: {{ .Values.sandbox.namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-sandbox-launcher
  namespace: {{ .Values.sandbox.namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: factory-sandbox-launcher }
subjects:
  - { kind: ServiceAccount, name: factory-worker, namespace: {{ .Release.Namespace }} }
