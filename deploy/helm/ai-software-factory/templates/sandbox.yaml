# Untrusted generated code runs here: Kata VM isolation, no egress, no service account token, quotas.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandbox.namespace }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    factory/sandbox: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: deny-all, namespace: {{ .Values.sandbox.namespace }} }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: sandbox-quota, namespace: {{ .Values.sandbox.namespace }} }
spec:
  hard:
    count/jobs.batch: {{ .Values.sandbox.maxConcurrentJobs | quote }}
    limits.cpu: {{ mul .Values.sandbox.maxConcurrentJobs 1 | quote }}
    limits.memory: {{ printf "%dGi" (int .Values.sandbox.maxConcurrentJobs) | quote }}
---
apiVersion: v1
kind: LimitRange
metadata: { name: sandbox-limits, namespace: {{ .Values.sandbox.namespace }} }
spec:
  limits:
    - type: Container
      max: { cpu: "2", memory: 2Gi }
      default: { cpu: "1", memory: 1Gi }
      defaultRequest: { cpu: 250m, memory: 256Mi }
