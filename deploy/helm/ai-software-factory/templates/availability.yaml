{{- range $c := list "api" "worker" }}
{{- $v := index $.Values $c }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: factory-{{ $c }} }
spec:
  minAvailable: 2
  selector: { matchLabels: { app.kubernetes.io/component: {{ $c }} } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: factory-{{ $c }} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: factory-{{ $c }} }
  minReplicas: {{ $v.hpa.min }}
  maxReplicas: {{ $v.hpa.max }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $v.hpa.cpu }} } }
{{- end }}
