name: infrastructure-planning
version: 1.0.0
owner: ai-platform-team
description: Plan infrastructure-as-code changes (Terraform on Azure) that pass policy
  checks.
compatibility:
  factory: '>=0.1'
  agents: any delivery agent
inputs:
- service contract
- NFRs
outputs:
- IaC change plan
- policy pre-check results
requested_capabilities:
- repo.read
data_classes:
- internal
- confidential
side_effects: none
network: false
limitations:
- Plans only; scoped deployment identity applies changes via the promotion pipeline.
risk: low
tests:
- name: structure
  expect_sections:
  - '## Inputs'
  - '## Outputs'
  - '## Procedure'
  - '## Limitations'
